# Quality gate — runs on every push to `develop` and on pull requests.
# Backend suites + Playwright page-health and user journeys on iPhone (WebKit), Android and desktop.
# A green run on `develop` is promoted to `main` automatically (Render deploys `main`).
name: quality-gate
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: omnivest
      JWT_SECRET: ci-secret-not-for-prod
      CORS_ORIGINS: http://localhost:3000
      OTP_DEMO_MODE: "true"
      OTP_DEMO_CODE: "123456"
      PUBLIC_ORIGIN: http://localhost:3000
      REACT_APP_BACKEND_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Backend deps
        run: pip install -r backend/requirements.txt
      - name: Start backend
        run: |
          cd backend && (uvicorn server:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/ >/dev/null && break; sleep 1; done
      - name: Backend test suites
        # share-contract and og-share need the public origin (they run against production after deploy)
        run: cd backend && python -m pytest tests -q -p no:cacheprovider --ignore=tests/test_share_contract.py --ignore=tests/test_og_share.py

      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Frontend build + serve
        run: |
          # CI=false: build exactly as Render does (pre-existing react-hooks lint warnings stay warnings, not build failures)
          cd frontend && yarn install --frozen-lockfile && CI=false yarn build
          npx --yes serve -s build -l 3000 > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/ >/dev/null && break; sleep 1; done

      - name: Seed a demo partner + listings (so listing pages are audited too)
        run: cd backend && python scripts/seed_demo.py seed

      - name: Playwright
        run: |
          cd e2e && npm ci && npx playwright install --with-deps chromium webkit
          # visual snapshots are recorded on Windows locally; CI (Linux) runs every other check
          npx playwright test --ignore-snapshots --reporter=list,html
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: e2e/report, retention-days: 14 }
      - name: Server logs on failure
        if: failure()
        run: tail -n 80 backend.log frontend.log || true

  promote:
    needs: gate
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fast-forward main to develop (green build only)
        run: |
          git config user.name "omnivest-gate"
          git config user.email "gate@omnivest.in"
          git fetch origin main
          git checkout -B main origin/main
          git merge --ff-only origin/develop
          git push origin main
