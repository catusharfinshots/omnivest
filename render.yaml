# Render Blueprint — deploys the FastAPI backend + React static site.
# In Render: New → Blueprint → select this repo. Only MONGO_URL must be
# entered by hand (the Atlas connection string); everything else is defined here.
services:
  # ---------- Backend (FastAPI + uvicorn) ----------
  - type: web
    name: omnivest-backend
    runtime: python
    # Free tier: no card needed. Trade-offs: spins down after ~15 min idle
    # (first request then takes ~30-60s) and no persistent disk (uploaded
    # files are lost on restart; DB data in Atlas is unaffected).
    # To go production-grade later: plan: starter, and re-add the disk:
    #   disk: {name: uploads, mountPath: /var/data, sizeGB: 1}
    # plus envVar UPLOADS_DIR=/var/data/uploads.
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MONGO_URL
        sync: false # paste the Atlas connection string in the Render dashboard
      - key: DB_NAME
        value: omnivest
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://omnivest.in,https://www.omnivest.in,https://omnivest-frontend.onrender.com
      - key: OTP_DEMO_MODE
        value: "true"
      - key: OTP_DEMO_CODE
        value: "123456"
      - key: PUBLIC_ORIGIN
        value: https://omnivest.in   # absolute URLs in share previews / OG images
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # ---------- Frontend (React static site) ----------
  - type: web
    name: omnivest-frontend
    runtime: static
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      # Same-origin /api → backend (mirrors the ingress Emergent provided)
      - type: rewrite
        source: /api/*
        destination: https://omnivest-backend.onrender.com/api/*
      # Short share links for listings: omnivest.in/s/<code> → backend OG page (image + redirect)
      - type: rewrite
        source: /s/*
        destination: https://omnivest-backend.onrender.com/api/og/s/*
      # Direct listing / manager URLs: crawlers get the page's own preview, humans get the app
      - type: rewrite
        source: /model-portfolios/*
        destination: https://omnivest-backend.onrender.com/api/og/page/model-portfolios/*
      - type: rewrite
        source: /manager/*
        destination: https://omnivest-backend.onrender.com/api/og/page/manager/*
      # Prerendered share-preview pages (scripts/prerender-og.js): the bare
      # /route URL must serve build/<route>/index.html with baked OG meta,
      # or the SPA catch-all would hand crawlers the homepage meta instead.
      - type: rewrite
        source: /model-portfolios
        destination: /model-portfolios/index.html
      - type: rewrite
        source: /about
        destination: /about/index.html
      - type: rewrite
        source: /aif
        destination: /aif/index.html
      - type: rewrite
        source: /advisory
        destination: /advisory/index.html
      - type: rewrite
        source: /faq
        destination: /faq/index.html
      - type: rewrite
        source: /learn
        destination: /learn/index.html
      - type: rewrite
        source: /managers
        destination: /managers/index.html
      - type: rewrite
        source: /mutual-funds
        destination: /mutual-funds/index.html
      - type: rewrite
        source: /stocks
        destination: /stocks/index.html
      - type: rewrite
        source: /fixed-deposits
        destination: /fixed-deposits/index.html
      - type: rewrite
        source: /collections
        destination: /collections/index.html
      - type: rewrite
        source: /explore
        destination: /explore/index.html
      - type: rewrite
        source: /calculators
        destination: /calculators/index.html
      - type: rewrite
        source: /partner
        destination: /partner/index.html
      - type: rewrite
        source: /partner/apply
        destination: /partner/apply/index.html
      # SPA fallback: all other paths serve the React app
      - type: rewrite
        source: /*
        destination: /index.html
